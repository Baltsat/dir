version: "3"

tasks:
  lint:
    desc: Create the clean DCO-correct replacement branch for issue 1886
    cmds:
      - |
        set -euo pipefail

        test "${GITHUB_REPOSITORY:-}" = "Baltsat/dir"

        git fetch origin main fix/1886-mapdatastore-concurrency

        upstream_main_sha="$(git rev-parse origin/main)"
        expected_upstream_sha="4f1ec1af810ee98caa2224083c75a16b932bc279"

        if [ "$upstream_main_sha" != "$expected_upstream_sha" ]; then
          echo "fork main no longer matches verified upstream main: $upstream_main_sha" >&2
          exit 1
        fi

        target_ref="refs/heads/fix/1886-mapdatastore-concurrency-dco"
        if git ls-remote --exit-code --heads origin "$target_ref" >/dev/null 2>&1; then
          echo "target branch already exists; refusing to overwrite" >&2
          exit 1
        fi

        workdir="$(mktemp -d)"
        trap 'git worktree remove --force "$workdir" >/dev/null 2>&1 || true' EXIT

        git worktree add --detach "$workdir" origin/main
        cd "$workdir"
        git switch -c fix/1886-mapdatastore-concurrency-dco
        git checkout origin/fix/1886-mapdatastore-concurrency -- \
          server/datastore/datastore.go \
          server/datastore/datastore_test.go

        changed_files="$(git diff --name-only)"
        expected_files=$'server/datastore/datastore.go\nserver/datastore/datastore_test.go'
        if [ "$changed_files" != "$expected_files" ]; then
          printf 'unexpected files:\n%s\n' "$changed_files" >&2
          exit 1
        fi

        git config user.name "Konstantin Baltsat"
        git config user.email "konstantin.baltsat@edu.esiee.fr"

        GIT_AUTHOR_NAME="Konstantin Baltsat" \
        GIT_AUTHOR_EMAIL="konstantin.baltsat@edu.esiee.fr" \
        GIT_COMMITTER_NAME="Konstantin Baltsat" \
        GIT_COMMITTER_EMAIL="konstantin.baltsat@edu.esiee.fr" \
          git commit \
            -m "fix(datastore): synchronize in-memory access" \
            -m "Signed-off-by: Konstantin Baltsat <konstantin.baltsat@edu.esiee.fr>"

        echo "--- created commit metadata ---"
        git show -s --format='commit=%H%nauthor-name=%an%nauthor-email=%ae%ncommitter-name=%cn%ncommitter-email=%ce%nmessage=%B' HEAD
        echo "--- changed files ---"
        git diff --name-status origin/main...HEAD

        git push origin HEAD:"$target_ref"
