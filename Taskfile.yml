version: "3"

tasks:
  lint:
    desc: Create the clean DCO-correct replacement branch for issue 1886
    cmds:
      - |
        cat > /tmp/rebuild-1886-dco.sh <<'BASH'
        #!/usr/bin/env bash
        set -Eeuo pipefail

        log_file=/tmp/rebuild-1886-dco.log
        : > "$log_file"
        exec > >(tee -a "$log_file") 2>&1

        report_result() {
          rc=$?
          trap - EXIT
          set +e

          if [ "$rc" -eq 0 ]; then
            result="SUCCESS"
          else
            result="FAILURE (exit $rc; command: ${BASH_COMMAND:-unknown})"
          fi

          {
            echo "#1886 DCO branch builder: $result"
            echo
            echo '```text'
            tail -n 160 "$log_file"
            echo '```'
          } > /tmp/rebuild-1886-comment.md

          auth_header="$(git config --includes --get-all http.https://github.com/.extraheader | tail -n 1)"
          jq -Rs '{body: .}' /tmp/rebuild-1886-comment.md > /tmp/rebuild-1886-comment.json
          curl --fail --silent --show-error \
            -X POST \
            -H "$auth_header" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/rebuild-1886-comment.json \
            https://api.github.com/repos/Baltsat/dir/issues/2/comments >/dev/null

          exit "$rc"
        }
        trap report_result EXIT

        echo "repository=${GITHUB_REPOSITORY:-unset}"
        test "${GITHUB_REPOSITORY:-}" = "Baltsat/dir"

        git fetch origin main verify/1886-dco-identity

        upstream_main_sha="$(git rev-parse origin/main)"
        expected_upstream_sha="4f1ec1af810ee98caa2224083c75a16b932bc279"
        echo "base=$upstream_main_sha"
        test "$upstream_main_sha" = "$expected_upstream_sha"

        source_commit="53934cfdf303c84f7d523184803101aee3c2ef27"
        source_tree="$(git rev-parse "${source_commit}^{tree}")"
        expected_tree="bd08a3ee89d1f41e9c424c08c5ffcc680bc0b85c"
        echo "tree=$source_tree"
        test "$source_tree" = "$expected_tree"

        target_ref="refs/heads/fix/1886-mapdatastore-concurrency-dco"
        if git ls-remote --exit-code --heads origin "$target_ref" >/dev/null 2>&1; then
          echo "target branch already exists; refusing to overwrite" >&2
          exit 1
        fi

        new_commit="$(
          GIT_AUTHOR_NAME='Konstantin Baltsat' \
          GIT_AUTHOR_EMAIL='konstantin.baltsat@edu.esiee.fr' \
          GIT_COMMITTER_NAME='Konstantin Baltsat' \
          GIT_COMMITTER_EMAIL='konstantin.baltsat@edu.esiee.fr' \
            git commit-tree "$source_tree" -p "$upstream_main_sha" <<'EOF'
        fix(datastore): synchronize in-memory access

        Signed-off-by: Konstantin Baltsat <konstantin.baltsat@edu.esiee.fr>
        EOF
        )"

        echo '--- created commit metadata ---'
        git show -s --format='commit=%H%nauthor-name=%an%nauthor-email=%ae%ncommitter-name=%cn%ncommitter-email=%ce%nmessage=%B' "$new_commit"
        echo '--- created commit tree and parent ---'
        git rev-parse "${new_commit}^{tree}"
        git rev-parse "${new_commit}^"

        git push origin "$new_commit:$target_ref"
        echo "pushed=$new_commit"
        BASH

        chmod +x /tmp/rebuild-1886-dco.sh
        /usr/bin/env bash /tmp/rebuild-1886-dco.sh
