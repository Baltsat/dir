name: Validate and publish issue 1882 fix

on:
  push:
    branches:
      - "automation/1882-publish"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: 4f1ec1af810ee98caa2224083c75a16b932bc279

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "client/go.sum"

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Apply minimal provider-registration patch
        shell: bash
        run: |
          set -euo pipefail

          cat > client/utils/cosign/kms_providers.go <<'EOF_GO'
          // Copyright AGNTCY Contributors (https://github.com/agntcy)
          // SPDX-License-Identifier: Apache-2.0

          package cosign

          // Register the same KMS providers as the Cosign CLI.
          import (
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/aws"
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/azure"
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/gcp"
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/hashivault"
          )
          EOF_GO

          cat > client/utils/cosign/kms_providers_test.go <<'EOF_TEST'
          // Copyright AGNTCY Contributors (https://github.com/agntcy)
          // SPDX-License-Identifier: Apache-2.0

          package cosign

          import (
          	"slices"
          	"testing"

          	"github.com/sigstore/sigstore/pkg/signature/kms"
          )

          func TestKMSProvidersRegistered(t *testing.T) {
          	t.Parallel()

          	providers := kms.SupportedProviders()
          	slices.Sort(providers)

          	for _, expected := range []string{
          		"awskms://",
          		"azurekms://",
          		"gcpkms://",
          		"hashivault://",
          	} {
          		if !slices.Contains(providers, expected) {
          			t.Errorf("registered KMS providers = %v, want %q", providers, expected)
          		}
          	}
          }
          EOF_TEST

          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/go.mod")
          text = path.read_text()
          needle = "\tgithub.com/sigstore/sigstore-go v1.2.2\n"
          dependencies = "".join(
              [
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/aws v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/azure v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/gcp v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/hashivault v1.10.8\n",
              ]
          )
          if text.count(needle) != 1:
              raise SystemExit("unexpected sigstore-go dependency layout")
          path.write_text(text.replace(needle, needle + dependencies))
          PY

          gofmt -w client/utils/cosign/kms_providers.go client/utils/cosign/kms_providers_test.go
          GOWORK=off go -C client mod tidy -go=1.26.5
          test "$(git hash-object client/go.mod)" = 9e2bc533e1748c2a244ff0560018a60ecce3477b
          test "$(git hash-object client/go.sum)" = 7297f73d5d67899a2e67a3f542a96348daafc906
          test "$(git hash-object client/utils/cosign/kms_providers.go)" = 67e48ff3b38091bcbd82034aabc24b9869871675
          test "$(git hash-object client/utils/cosign/kms_providers_test.go)" = b2a6f617c02b3bfd208487da6400c25510d54b94
          git diff --check
          test -z "$(gofmt -l client/utils/cosign/kms_providers.go client/utils/cosign/kms_providers_test.go)"

      - name: Verify module metadata is stable
        shell: bash
        run: |
          set -euo pipefail
          cp client/go.mod /tmp/client.go.mod.before
          cp client/go.sum /tmp/client.go.sum.before
          GOWORK=off go -C client mod tidy -go=1.26.5
          cmp /tmp/client.go.mod.before client/go.mod
          cmp /tmp/client.go.sum.before client/go.sum

      - name: Run focused deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go -C client test ./utils/cosign -run '^TestKMSProvidersRegistered$' -count=100
          GOWORK=off go -C client test -race ./utils/cosign -run '^TestKMSProvidersRegistered$' -count=1
          GOWORK=off go -C client vet ./utils/cosign

      - name: Run client module checks
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go -C client test ./...
          GOWORK=off go -C client vet ./...

      - name: Run client module lint
        shell: bash
        run: |
          set -euo pipefail
          task deps:golangci-lint
          (cd client && ../.bin/golangci-lint-2.11.3 run --config ../.golangci.yml ./...)

      - name: Create exact-identity commit and publish final branch
        shell: bash
        env:
          GIT_AUTHOR_NAME: Konstantin Baltsat
          GIT_AUTHOR_EMAIL: konstantin.baltsat@edu.esiee.fr
          GIT_COMMITTER_NAME: Konstantin Baltsat
          GIT_COMMITTER_EMAIL: konstantin.baltsat@edu.esiee.fr
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add client/go.mod client/go.sum client/utils/cosign/kms_providers.go client/utils/cosign/kms_providers_test.go
          test "$(git diff --cached --name-only | sort)" = $'client/go.mod\nclient/go.sum\nclient/utils/cosign/kms_providers.go\nclient/utils/cosign/kms_providers_test.go'
          git diff --cached --check
          git commit --signoff -m "fix(cosign): register cloud KMS providers"
          test "$(git rev-parse HEAD^)" = 4f1ec1af810ee98caa2224083c75a16b932bc279
          test "$(git show -s --format=%an HEAD)" = "$GIT_AUTHOR_NAME"
          test "$(git show -s --format=%ae HEAD)" = "$GIT_AUTHOR_EMAIL"
          test "$(git show -s --format=%cn HEAD)" = "$GIT_COMMITTER_NAME"
          test "$(git show -s --format=%ce HEAD)" = "$GIT_COMMITTER_EMAIL"
          git show -s --format=%B HEAD | grep -Fx "Signed-off-by: Konstantin Baltsat <konstantin.baltsat@edu.esiee.fr>"
          test "$(git show HEAD:client/go.mod | git hash-object --stdin)" = 9e2bc533e1748c2a244ff0560018a60ecce3477b
          test "$(git show HEAD:client/go.sum | git hash-object --stdin)" = 7297f73d5d67899a2e67a3f542a96348daafc906
          test "$(git show HEAD:client/utils/cosign/kms_providers.go | git hash-object --stdin)" = 67e48ff3b38091bcbd82034aabc24b9869871675
          test "$(git show HEAD:client/utils/cosign/kms_providers_test.go | git hash-object --stdin)" = b2a6f617c02b3bfd208487da6400c25510d54b94
          git push --force-with-lease=refs/heads/fix/1882-cloud-kms-providers:4f1ec1af810ee98caa2224083c75a16b932bc279 origin HEAD:refs/heads/fix/1882-cloud-kms-providers
