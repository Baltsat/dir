name: Diagnose issue 1882 module metadata

on:
  push:
    branches:
      - "automation/1882-publish"

permissions:
  contents: read

jobs:
  diagnose-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 4f1ec1af810ee98caa2224083c75a16b932bc279

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "client/go.sum"

      - name: Apply provider dependency promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/go.mod")
          text = path.read_text()
          needle = "\tgithub.com/sigstore/sigstore-go v1.2.2\n"
          dependencies = "".join(
              [
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/aws v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/azure v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/gcp v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/hashivault v1.10.8\n",
              ]
          )
          if text.count(needle) != 1:
              raise SystemExit("unexpected sigstore-go dependency layout")
          path.write_text(text.replace(needle, needle + dependencies))
          PY

      - name: Print exact Go 1.26.5 tidy diff and fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp client/go.mod /tmp/client.go.mod.before
          cp client/go.sum /tmp/client.go.sum.before
          GOWORK=off go -C client mod tidy -go=1.26.5
          changed=0
          if ! cmp -s /tmp/client.go.mod.before client/go.mod; then
            echo "::group::client/go.mod tidy diff"
            diff -u /tmp/client.go.mod.before client/go.mod || true
            echo "::endgroup::"
            changed=1
          fi
          if ! cmp -s /tmp/client.go.sum.before client/go.sum; then
            echo "::group::client/go.sum tidy diff"
            diff -u /tmp/client.go.sum.before client/go.sum || true
            echo "::endgroup::"
            changed=1
          fi
          if [ "$changed" -ne 0 ]; then
            echo "module metadata requires the printed tidy changes"
            exit 1
          fi
          echo "module metadata is already tidy"
