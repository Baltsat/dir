name: Diagnose issue 1882 lint

on:
  push:
    branches:
      - "automation/1882-publish"

permissions:
  contents: read

jobs:
  diagnose-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 4f1ec1af810ee98caa2224083c75a16b932bc279

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "client/go.sum"

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat > client/utils/cosign/kms_providers.go <<'EOF_GO'
          // Copyright AGNTCY Contributors (https://github.com/agntcy)
          // SPDX-License-Identifier: Apache-2.0

          package cosign

          // Register the same KMS providers as the Cosign CLI.
          import (
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/aws"
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/azure"
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/gcp"
          	_ "github.com/sigstore/sigstore/pkg/signature/kms/hashivault"
          )
          EOF_GO
          cat > client/utils/cosign/kms_providers_test.go <<'EOF_TEST'
          // Copyright AGNTCY Contributors (https://github.com/agntcy)
          // SPDX-License-Identifier: Apache-2.0

          package cosign

          import (
          	"slices"
          	"testing"

          	"github.com/sigstore/sigstore/pkg/signature/kms"
          )

          func TestKMSProvidersRegistered(t *testing.T) {
          	t.Parallel()
          	providers := kms.SupportedProviders()
          	slices.Sort(providers)
          	for _, expected := range []string{
          		"awskms://",
          		"azurekms://",
          		"gcpkms://",
          		"hashivault://",
          	} {
          		if !slices.Contains(providers, expected) {
          			t.Errorf("registered KMS providers = %v, want %q", providers, expected)
          		}
          	}
          }
          EOF_TEST
          gofmt -w client/utils/cosign/kms_providers.go client/utils/cosign/kms_providers_test.go
          GOWORK=off go -C client mod edit \
            -require=github.com/sigstore/sigstore/pkg/signature/kms/aws@v1.10.8 \
            -require=github.com/sigstore/sigstore/pkg/signature/kms/azure@v1.10.8 \
            -require=github.com/sigstore/sigstore/pkg/signature/kms/gcp@v1.10.8 \
            -require=github.com/sigstore/sigstore/pkg/signature/kms/hashivault@v1.10.8
          GOWORK=off go -C client mod tidy -go=1.26.5
          test "$(git hash-object client/go.mod)" = 9e2bc533e1748c2a244ff0560018a60ecce3477b
          test "$(git hash-object client/go.sum)" = 7297f73d5d67899a2e67a3f542a96348daafc906
          test "$(git hash-object client/utils/cosign/kms_providers.go)" = 67e48ff3b38091bcbd82034aabc24b9869871675
          test "$(git hash-object client/utils/cosign/kms_providers_test.go)" = b2a6f617c02b3bfd208487da6400c25510d54b94

      - name: Capture exact linter transcript
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/issue1882-lint
          {
            echo '$ task deps:golangci-lint'
            task deps:golangci-lint
          } > /tmp/issue1882-lint/lint.txt 2>&1
          install_status=$?
          echo "install_status=$install_status" >> /tmp/issue1882-lint/lint.txt
          lint_status=125
          if [ "$install_status" -eq 0 ]; then
            {
              echo '$ (cd client && ../.bin/golangci-lint-2.11.3 run --config ../.golangci.yml ./...)'
              cd client
              ../.bin/golangci-lint-2.11.3 run --config ../.golangci.yml ./...
            } >> /tmp/issue1882-lint/lint.txt 2>&1
            lint_status=$?
          fi
          echo "lint_status=$lint_status" >> /tmp/issue1882-lint/lint.txt
          exit 0

      - name: Upload linter transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1882-lint-transcript
          path: /tmp/issue1882-lint
          retention-days: 1
