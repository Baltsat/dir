name: Capture issue 1882 tidy artifact

on:
  push:
    branches:
      - "automation/1882-publish"

permissions:
  contents: read

jobs:
  capture-tidy-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 4f1ec1af810ee98caa2224083c75a16b932bc279

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "client/go.sum"

      - name: Produce exact tidied module metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/go.mod")
          text = path.read_text()
          needle = "\tgithub.com/sigstore/sigstore-go v1.2.2\n"
          dependencies = "".join(
              [
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/aws v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/azure v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/gcp v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/hashivault v1.10.8\n",
              ]
          )
          if text.count(needle) != 1:
              raise SystemExit("unexpected sigstore-go dependency layout")
          path.write_text(text.replace(needle, needle + dependencies))
          PY

          GOWORK=off go -C client mod tidy -go=1.26.5
          mkdir -p /tmp/issue1882-tidy/client
          cp client/go.mod /tmp/issue1882-tidy/client/go.mod
          cp client/go.sum /tmp/issue1882-tidy/client/go.sum
          {
            echo "go=$(go version)"
            echo "go.mod=$(git hash-object client/go.mod)"
            echo "go.sum=$(git hash-object client/go.sum)"
          } > /tmp/issue1882-tidy/metadata.txt

      - name: Upload exact tidied metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1882-tidy-metadata
          path: /tmp/issue1882-tidy
          retention-days: 1
