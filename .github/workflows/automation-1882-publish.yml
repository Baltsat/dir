name: Capture issue 1882 tidy output

on:
  push:
    branches:
      - "automation/1882-publish"

permissions:
  contents: write

jobs:
  capture-tidy-output:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: 4f1ec1af810ee98caa2224083c75a16b932bc279

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "client/go.sum"

      - name: Apply dependency promotion, tidy, and publish disposable output
        shell: bash
        env:
          GIT_AUTHOR_NAME: Konstantin Baltsat
          GIT_AUTHOR_EMAIL: konstantin.baltsat@edu.esiee.fr
          GIT_COMMITTER_NAME: Konstantin Baltsat
          GIT_COMMITTER_EMAIL: konstantin.baltsat@edu.esiee.fr
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/go.mod")
          text = path.read_text()
          needle = "\tgithub.com/sigstore/sigstore-go v1.2.2\n"
          dependencies = "".join(
              [
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/aws v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/azure v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/gcp v1.10.8\n",
                  "\tgithub.com/sigstore/sigstore/pkg/signature/kms/hashivault v1.10.8\n",
              ]
          )
          if text.count(needle) != 1:
              raise SystemExit("unexpected sigstore-go dependency layout")
          path.write_text(text.replace(needle, needle + dependencies))
          PY

          GOWORK=off go -C client mod tidy -go=1.26.5
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add client/go.mod client/go.sum
          if git diff --cached --quiet; then
            echo "go mod tidy produced no metadata change"
          else
            git commit --signoff -m "chore: capture issue 1882 tidy output"
          fi
          test "$(git show -s --format=%an HEAD)" = "$GIT_AUTHOR_NAME"
          test "$(git show -s --format=%ae HEAD)" = "$GIT_AUTHOR_EMAIL"
          test "$(git show -s --format=%cn HEAD)" = "$GIT_COMMITTER_NAME"
          test "$(git show -s --format=%ce HEAD)" = "$GIT_COMMITTER_EMAIL"
          git push --force origin HEAD:refs/heads/automation/1882-tidy-output
