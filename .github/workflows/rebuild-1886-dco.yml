name: Rebuild 1886 DCO branch

on:
  push:
    branches:
      - verify/1886-dco-identity

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'Baltsat/dir'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create clean DCO-correct branch
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/agntcy/dir.git 2>/dev/null || true
          git fetch upstream main
          git fetch origin fix/1886-mapdatastore-concurrency

          git switch --detach upstream/main
          git switch -c fix/1886-mapdatastore-concurrency-dco
          git checkout origin/fix/1886-mapdatastore-concurrency -- \
            server/datastore/datastore.go \
            server/datastore/datastore_test.go

          git config user.name 'Konstantin Baltsat'
          git config user.email 'konstantin.baltsat@edu.esiee.fr'

          GIT_AUTHOR_NAME='Konstantin Baltsat' \
          GIT_AUTHOR_EMAIL='konstantin.baltsat@edu.esiee.fr' \
          GIT_COMMITTER_NAME='Konstantin Baltsat' \
          GIT_COMMITTER_EMAIL='konstantin.baltsat@edu.esiee.fr' \
            git commit \
              -m 'fix(datastore): synchronize in-memory access' \
              -m 'Signed-off-by: Konstantin Baltsat <konstantin.baltsat@edu.esiee.fr>'

          git push origin HEAD:refs/heads/fix/1886-mapdatastore-concurrency-dco
